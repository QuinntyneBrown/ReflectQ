<div class="text-area-field">
  <textarea
    class="text-area-field__input"
    [placeholder]="placeholder"
    [maxLength]="maxLength"
    [value]="value"
    (input)="onInput($event)"
  ></textarea>
  <span class="text-area-field__count">{{ value.length }} / {{ maxLength }} characters</span>
</div>
